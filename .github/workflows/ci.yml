name: CI

# Protects the green baseline and the reproducibility guarantees: lint + the
# full (data-free, synthetic-fixture) test suite on every push and PR. Pinned to
# Python 3.11 to match the Streamlit Cloud deploy target, which also exercises
# the cross-version byte-stability of the committed JSON summaries.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests app

      - name: Tests (pytest)
        run: uv run pytest -q
