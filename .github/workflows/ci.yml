name: CI

# Two jobs. "test" runs ruff and the data-free test suite (synthetic fixtures
# only) on every push and pull request, under the pinned Python 3.11 used for
# the research baseline. "dashboard" installs only the deployed dashboard
# dependencies and smoke-tests the app entrypoint and pages against the
# committed bundle on two Python versions.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  dashboard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only the deployed dashboard dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Smoke entrypoint and pages against the committed bundle
        run: python -m unittest discover -s app/tests -v

  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests app scripts

      - name: Tests (pytest)
        run: uv run pytest -q
