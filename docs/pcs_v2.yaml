# PCS -- generated mirror of src.pcs.PCS_V2 (the wide semantic registry).
# Canonical source is the Python dataclasses; regenerate via:
#   uv run python -m src.pcs
version: "v2"
projections:
  - name: "impact_index_v1"
    version: "v1"
    units: "degC per decade"
    aggregation_rule: "unweighted mean across city-locations"
    computation_definition: "Country mean of the per-city-location Theil-Sen warming slopes over the analysis window (degrees Celsius per decade); a warming-exposure projection."
    definition_hash: "41eb1820504a9e5d5e2d07cb40a2f505a655781c973753a18dc6359995ce1fea"
  - name: "responsibility_index_consumption"
    version: "v2"
    units: "t CO2 per capita"
    aggregation_rule: "sum-then-divide over the consumption-available window"
    computation_definition: "Cumulative consumption-based CO2 emissions (emissions counted where goods are consumed) summed over each country's consumption-available window [first year consumption data exists .. analysis cutoff], divided by cutoff-year population (tonnes per capita); a consumption-based historical-responsibility projection."
    definition_hash: "e93f3aebe02ec1e40898a3112a24c528994985857ba61c3e72a9dfba6d617281"
  - name: "responsibility_index_production_matched"
    version: "v2"
    units: "t CO2 per capita"
    aggregation_rule: "sum-then-divide over the consumption-available window"
    computation_definition: "Cumulative production-based CO2 emissions summed over the SAME consumption-available window as responsibility_index_consumption, divided by cutoff-year population (tonnes per capita); the window-matched production baseline for an apples-to-apples production-vs-consumption responsibility comparison."
    definition_hash: "323f6051d9983415d142978ea49a0d7ac0c03e0041d8a87bd746b0c3f37b740d"
  - name: "responsibility_index_v1"
    version: "v1"
    units: "t CO2 per capita"
    aggregation_rule: "sum-then-divide"
    computation_definition: "Cumulative production-based CO2 emissions summed through the analysis cutoff year, divided by cutoff-year population (tonnes per capita); a historical-responsibility projection."
    definition_hash: "75f5ea036cc35015a98d55943ca89a4119043066e33a324f4fd91d1c759e51aa"
  - name: "impact_index_population_weighted"
    version: "v2"
    units: "degC per decade"
    aggregation_rule: "population-weighted mean across city-locations"
    computation_definition: "Country mean of the per-city-location Theil-Sen warming slopes weighted by each location's population (sampled from a static population grid at its coordinates), degrees Celsius per decade; a people-weighted warming-exposure projection -- the warming the average resident experiences, rather than the average station."
    definition_hash: "d145897cb4933ae8bc9c1f0c7c24b350171b2a062ddaf24273636d02031157b1"
  - name: "impact_index_area_weighted"
    version: "v2"
    units: "degC per decade"
    aggregation_rule: "cos(latitude) area-weighted mean across gridded land cells"
    computation_definition: "Country mean of per-grid-cell Theil-Sen warming slopes from the Berkeley Earth 1-degree gridded field over the analysis window, each cell assigned to a country via the GPW national-identifier grid and weighted by cos(latitude) so every unit of land area counts equally (degrees Celsius per decade); an area-weighted warming-exposure projection -- the warming of the average square kilometre, rather than the average station. cos(latitude) weighting is required because a temperature trend is an intensive field, the mirror of the population-count rule where it is forbidden."
    definition_hash: "8af7ff7937b9564babf3e4dd3ea3bc71599466b7bc99e277177cfc878b7c8f14"
