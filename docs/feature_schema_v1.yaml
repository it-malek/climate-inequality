# X-Schema -- generated mirror of src.feature_schema.SCHEMA_V1.
# Canonical source is the Python dataclasses; regenerate via:
#   uv run python -m src.feature_schema
version: "v1"
maturity: "candidate"
unit_of_analysis: "country"
outcome:
  name: "warming_trend"
  description: "Country mean 1950-2013 Theil-Sen warming slope -- the quantity whose cross-country inequality (variance) is attributed to the feature groups."
  unit: "degC/decade"
  status: "available"
groups:
  - key: "emissions"
    title: "Emissions / industrial-activity responsibility"
    rationale: "Proxies for historical industrial responsibility. One group of several structuring axes -- a responsibility axis, never a causal driver and never the privileged parameter."
    features:
      - name: "cum_co2_per_capita"
        description: "Cumulative production-based CO2 through the cutoff year per capita; historical emissions responsibility relative to population."
        unit: "t/person"
        status: "available"
      - name: "cum_co2_total"
        description: "Absolute cumulative production-based CO2 through the cutoff year; total scale of a country's industrial footprint."
        unit: "Mt"
        status: "available"
      - name: "co2_intensity_gdp"
        description: "CO2 emitted per unit of economic output; carbon intensity of the economy."
        unit: "t/USD"
        status: "proposed"
  - key: "geography"
    title: "Geography / physical structuring constraints"
    rationale: "Where a country sits on the planet. A first-class physical axis the decomposition is about, not a nuisance control to be partialled out."
    features:
      - name: "abs_latitude"
        description: "Mean absolute latitude of the country's stations; distance from the equator and proxy for the polar-amplification gradient."
        unit: "degrees"
        status: "available"
      - name: "elevation"
        description: "Mean station elevation above sea level; altitude regime."
        unit: "m"
        status: "available"
      - name: "continentality"
        description: "Mean distance from the country's stations to the coastline; maritime vs continental thermal regime."
        unit: "km"
        status: "available"
      - name: "climate_zone"
        description: "Dominant Koeppen-Geiger major group (A-E); physical climate regime."
        unit: "category"
        status: "available"
      - name: "hemisphere"
        description: "Northern or Southern hemisphere; hemispheric land/ocean asymmetry in warming."
        unit: "category"
        status: "available"
      - name: "spatial_block"
        description: "Continent or spatial-cluster identifier; coarse spatial-autocorrelation block capturing regional co-structure."
        unit: "category"
        status: "available"
  - key: "socioeconomic"
    title: "Socioeconomic development structure"
    rationale: "Development stage and adaptive-capacity structure -- distinct from demographic scale, so the decomposition can separate the two."
    features:
      - name: "income_group"
        description: "World Bank income classification (low / lower-middle / upper-middle / high); development stage."
        unit: "category"
        status: "available"
      - name: "gdp_per_capita"
        description: "Gross domestic product per capita; economic development level."
        unit: "USD/person"
        status: "proposed"
  - key: "population"
    title: "Population / urbanization structure"
    rationale: "Demographic scale and how concentrated / urban a country is -- a mechanism separate from development stage."
    features:
      - name: "population"
        description: "Country population at the cutoff year; demographic scale."
        unit: "people"
        status: "available"
      - name: "urbanization_rate"
        description: "Share of population living in urban areas; urbanization level."
        unit: "fraction"
        status: "proposed"
      - name: "station_density"
        description: "Local density of city stations around a country's locations; urban-concentration and sampling-density proxy."
        unit: "count"
        status: "available"
  - key: "residual"
    title: "Residual / unobserved structured block"
    rationale: "The variance not attributed to the four named groups (1 - R^2). Declared with no input features so Shapley output always reports a residual share and the stability layer can later test whether it is spatially structured (Moran's I / Conley HAC) rather than noise. No feature may be materialized here without bumping the schema version."
    features: []
