[project]
name = "climate-inequality"
version = "2.0.0"
description = "Cross-country structure of observed land warming, 1950-2013: geography, historical emissions responsibility, development, population, and the spatial residual"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14",
    "pyproj>=3.6",
    "shapely>=2.0",
    "pyogrio>=0.7",
    "duckdb>=1.0",
    "scipy>=1.11",
    "plotly>=5.20",
    "geopandas>=0.14",
    "pykrige>=1.7",
    "streamlit>=1.35",
    "kagglehub>=0.3",
    "requests>=2.31",
    "statsmodels>=0.14",
    "xarray>=2026.4.0",
    "netcdf4>=1.7.4",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
# Copernicus client for scripts/fetch_era5.py (the ERA5 cross-check); never
# imported by src or the tests.
era5 = ["cdsapi>=0.7"]
notebooks = ["jupyter"]
figures = [
    "matplotlib>=3.9",
]

[dependency-groups]
# Select the deployment subset; version constraints stay in project.dependencies.
dashboard = ["streamlit", "plotly", "pandas", "numpy", "pyarrow", "statsmodels"]

[tool.pytest.ini_options]
testpaths = ["tests", "research/model_v2/tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["notebooks"]
