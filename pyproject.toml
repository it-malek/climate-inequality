[project]
name = "climate-inequality"
version = "0.1.0"
description = "Geospatial analysis of warming trends vs emissions responsibility, using Berkeley Earth surface temperature data"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "duckdb>=1.0",
    "scipy>=1.11",
    "plotly>=5.20",
    "geopandas>=0.14",
    "pykrige>=1.7",
    "streamlit>=1.35",
    "kagglehub>=0.3",
    "requests>=2.31",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "jupyter",
    "xarray>=2026.4.0",
    "netcdf4>=1.7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
